<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>استراحة الفضاء — عالم التحديات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="space-lounge.css?v=5">
</head>
<body>
<header class="sl-topbar">
  <a class="sl-chip" href="/">↩ البرنامج</a>
  <div class="sl-brand"><img src="/images/logo.png" alt=""><span>استراحة الفضاء<small>SPACE LOUNGE V5</small></span></div>
  <div class="sl-spacer"></div>
  <span class="sl-chip" id="loungeConnection"><span class="dot"></span> جارٍ الاتصال…</span>
  <span class="sl-chip" id="participantCount">0 / 50</span>
  <button class="sl-chip" id="cameraBtn" type="button">🎥 مسح</button>
  <button class="sl-chip" id="musicToggle" type="button" aria-pressed="false">♪ الموسيقى</button>
  <button class="sl-chip" id="hostPanelToggle" type="button">⚙️ المضيف</button>
</header>

<main id="loungeStage">
  <div class="sl-zone sl-zone-roam" data-zone="roam"></div>
  <div class="sl-zone sl-zone-bar" data-zone="bar"></div>
  <div class="sl-zone sl-zone-floor" data-zone="floor"></div>
  <div id="participantLayer"></div>
  <div class="sl-fx" id="fxLayer"></div>
</main>

<div class="sl-toast" id="actionToast"></div>
<div class="sl-camlabel" id="cameraLabel"></div>

<aside class="sl-host" id="hostPanel">
  <h3>لوحة المضيف</h3>
  <form id="manualParticipantForm">
    <label for="manualName">اسم المشارك</label>
    <input id="manualName" maxlength="24" placeholder="الاسم الذي يظهر فوق الرأس" required>
    <label for="manualHandle" style="margin-top:6px">@الحساب (اختياري)</label>
    <input id="manualHandle" maxlength="24" placeholder="unique_id من تيك توك">
    <button class="sl-btn" type="submit" style="width:100%;margin-top:8px">＋ إضافة للساحة</button>
  </form>
  <div class="sl-row">
    <button class="sl-btn" id="groupDanceBtn" type="button">💃 رقصة جماعية</button>
    <button class="sl-btn" id="zeroGBtn" type="button">🪽 انعدام جاذبية</button>
  </div>
  <div class="sl-row">
    <button class="sl-btn" id="flyBtn" type="button">🚀 عاصفة طيران</button>
    <button class="sl-btn danger" id="clearParticipants" type="button">🧹 إخلاء</button>
  </div>
  <div class="sl-row">
    <button class="sl-btn" id="toggleFullscreen" type="button">⛶ ملء الشاشة</button>
  </div>
  <p class="sl-hint">الدخول التلقائي عند تعليق: good live / عالم التحديات / تحدي مروان / قدها. الهدايا تشغّل رقصتها وتركّز الكاميرا سينمائيًا. لا جنس ولا صور — الاسم و@الحساب فقط فوق الرأس.</p>
</aside>

<script src="three-r187.bundle.js?v=1"></script>
<script src="space-lounge-3d.js?v=5"></script>
<script src="space-lounge.js?v=5"></script>
</body>
</html>
