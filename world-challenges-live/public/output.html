<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b18">
  <meta name="robots" content="noindex,nofollow">
  <title>مخرج العرض — عالم التحديات</title>
  <link rel="stylesheet" href="/output.css?v=20261114-qaddaha-output-v1">
  <script defer src="/output.js?v=20261114-qaddaha-output-v1"></script>
</head>
<body>
  <main class="output-frame" aria-label="مخرج عرض عالم التحديات">
    <header class="output-header">
      <div class="brand-lockup"><span class="brand-orb" aria-hidden="true">ق</span><div><small>عالم التحديات</small><strong>استديو قدها</strong></div></div>
      <div id="connectionStatus" class="connection-status is-stale" role="status" aria-live="polite"><i aria-hidden="true"></i><span id="connectionText">التحديث متوقف</span></div>
    </header>

    <section class="output-scoreboard" aria-label="نتيجة الفريقين">
      <article class="team-card team-girls"><span class="team-caption">الفريق</span><strong>البنات</strong><b id="girlsScore">0</b><small>النقاط</small></article>
      <div class="score-divider" aria-hidden="true"><span>VS</span></div>
      <article class="team-card team-boys"><span class="team-caption">الفريق</span><strong>الشباب</strong><b id="boysScore">0</b><small>النقاط</small></article>
    </section>

    <section class="captains-card" aria-label="كباتن الفريقين">
      <div class="captains-heading"><span>أهل التحدي</span><i></i><small>الكباتن</small></div>
      <div class="captains-grid">
        <div class="captain-team captain-girls"><b>كابتن البنات</b><div id="girlsCaptains" class="captain-names"><span class="captain-empty">بانتظار التسمية</span></div></div>
        <div class="captain-team captain-boys"><b>كابتن الشباب</b><div id="boysCaptains" class="captain-names"><span class="captain-empty">بانتظار التسمية</span></div></div>
      </div>
    </section>

    <section class="question-card" aria-label="السؤال الحالي">
      <div class="question-kicker"><span>سؤال المواجهة</span><i></i><small>فكّروا بسرعة</small></div>
      <p id="questionText">في انتظار المنافسة</p>
    </section>

    <section class="timer-card" aria-label="المؤقت">
      <div class="timer-copy"><small>الوقت المتبقي</small><strong id="timerState">المؤقت متوقف</strong></div>
      <div class="timer-face"><b id="timerValue">--</b><span>ثانية</span></div>
      <div class="timer-track" aria-hidden="true"><i id="timerProgress"></i></div>
    </section>

    <footer class="output-footer"><span>مخرج عرض مستقل</span><i></i><span>قراءة فقط</span></footer>
  </main>
</body>
</html>
