<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مسابقة عالم التحديات</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/images/logo.png">
  <link rel="apple-touch-icon" href="/images/logo.png">
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">

    <!-- ===== SETUP SCREEN ===== -->
    <section id="setupScreen" class="screen">
      <div class="setup-header">
        <img src="/images/logo.png" alt="عالم التحديات" class="logo-img">
        <h1>مسابقة عالم التحديات</h1>
        <p>جهّز جولتك وابدأ التحدي!</p>
      </div>

      <div class="setup-card">
        <div class="form-group">
          <label>طريقة اللعب</label>
          <div class="mode-tabs">
            <button class="tab active" data-mode="single">🎯 جولة واحدة</button>
            <button class="tab" data-mode="fullshow">🎬 لايف كامل</button>
          </div>
        </div>

        <div class="form-group" id="categoryGroup">
          <label>الفئة</label>
          <select id="category">
            <option value="معلومات عامة">🧠 معلومات عامة</option>
            <option value="جغرافيا">🌍 جغرافيا</option>
            <option value="علوم">🔬 علوم</option>
            <option value="تاريخ">📜 تاريخ</option>
            <option value="أسئلة دينية">🕌 دين</option>
            <option value="ألغاز">🧩 ألغاز</option>
            <option value="رياضة">⚽ رياضة</option>
            <option value="تكنولوجيا">💻 تكنولوجيا</option>
            <option value="اختيارات متنوعة">🎲 خليط</option>
          </select>
        </div>

        <div class="form-group">
          <label>الصعوبة</label>
          <select id="difficulty">
            <option value="سهل">⭐ سهل</option>
            <option value="متوسط" selected>⭐⭐ متوسط</option>
            <option value="صعب">⭐⭐⭐ صعب</option>
          </select>
        </div>

        <div class="form-group">
          <label>عدد الأسئلة</label>
          <div class="number-input">
            <button class="num-btn" data-action="minus">−</button>
            <input id="count" type="number" min="1" max="50" value="10">
            <button class="num-btn" data-action="plus">+</button>
          </div>
        </div>

        <div class="form-group" id="fullShowOptions" style="display:none">
          <label>مدة اللايف</label>
          <div class="duration-chips">
            <button class="chip" data-duration="60">ساعة</button>
            <button class="chip active" data-duration="120">ساعتين</button>
            <button class="chip" data-duration="180">3 ساعات</button>
          </div>
        </div>

        <div class="form-group">
          <label>وقت الإجابة</label>
          <div class="timer-chips">
            <button class="chip" data-timer="5">5 ث</button>
            <button class="chip active" data-timer="10">10 ث</button>
            <button class="chip" data-timer="15">15 ث</button>
            <button class="chip" data-timer="20">20 ث</button>
          </div>
        </div>

        <button id="generateBtn" class="generate-btn">
          <span>🤖</span> جهّز الجولة بالـ AI
        </button>
      </div>
    </section>

    <!-- ===== GAME SCREEN ===== -->
    <section id="gameScreen" class="screen hidden">

      <!-- Gifts Bar -->
      <div class="gifts-bar">
        <div class="gift-item" data-gift="shield" title="درع الحماية - يحمي من خسارة النقطة">
          <img src="/images/gift-shield.png" alt="درع">
          <span class="gift-name">درع الحماية</span>
        </div>
        <div class="gift-item" data-gift="trophy" title="كأس النصر - نقطة إضافية">
          <img src="/images/gift-trophy.png" alt="كأس">
          <span class="gift-name">كأس النصر</span>
        </div>
        <div class="gift-item" data-gift="time" title="ساعة الزمن - 10 ثواني إضافية">
          <img src="/images/gift-time.png" alt="زمن">
          <span class="gift-name">ساعة الزمن</span>
        </div>
        <div class="gift-item" data-gift="megaphone" title="مكبر الصوت - تشجيع الفريق">
          <img src="/images/gift-megaphone.png" alt="مكبر">
          <span class="gift-name">مكبر الصوت</span>
        </div>
        <div class="gift-item" data-gift="star" title="نجمة مضاعفة - نقطة x2">
          <img src="/images/gift-star.png" alt="نجمة">
          <span class="gift-name">نجمة مضاعفة</span>
        </div>
        <div class="gift-item" data-gift="bomb" title="قنبلة - حذف إجابة خاطئة">
          <img src="/images/gift-bomb.png" alt="قنبلة">
          <span class="gift-name">قنبلة</span>
        </div>
      </div>

      <!-- Teams Battle Area -->
      <div class="battle-arena">
        <!-- Girls Team (Right in RTL) -->
        <div class="team-side team-girls">
          <div class="team-character">
            <img src="/images/girl-team.png" alt="فريق البنات">
          </div>
          <div class="team-name-girls">البنات</div>
          <div class="rounds-won" id="girlsRoundsWon">🏆 0</div>
          <div class="score-boxes" id="girlsScoreBoxes">
            <div class="score-box"></div>
            <div class="score-box"></div>
            <div class="score-box"></div>
            <div class="score-box"></div>
            <div class="score-box"></div>
          </div>
        </div>

        <!-- VS Center -->
        <div class="vs-center">
          <div class="round-display" id="roundDisplay">الجولة 1</div>
          <div class="vs-text">VS</div>
          <div class="timer-display" id="timerDisplay">10</div>
        </div>

        <!-- Boys Team (Left in RTL) -->
        <div class="team-side team-boys">
          <div class="team-character">
            <img src="/images/boy-team.png" alt="فريق الشباب">
          </div>
          <div class="team-name-boys">الشباب</div>
          <div class="rounds-won" id="boysRoundsWon">🏆 0</div>
          <div class="score-boxes" id="boysScoreBoxes">
            <div class="score-box"></div>
            <div class="score-box"></div>
            <div class="score-box"></div>
            <div class="score-box"></div>
            <div class="score-box"></div>
          </div>
        </div>
      </div>

      <!-- Question Area -->
      <div class="question-area">
        <div class="question-counter" id="questionCounter">السؤال 1 / 10</div>
        <div class="category-badge" id="categoryBadge">🧠 معلومات عامة</div>
        <h2 class="question-text" id="questionText"></h2>
        <div class="options-grid" id="optionsGrid"></div>
        <div class="answer-reveal hidden" id="answerReveal">
          <div class="answer-header">✅ الإجابة الصحيحة</div>
          <div class="answer-text" id="answerText"></div>
          <div class="explanation" id="explanationText"></div>
        </div>
      </div>

      <!-- Controls -->
      <div class="game-controls">
        <button id="startTimerBtn" class="ctrl-btn primary">⏱️ ابدأ</button>
        <button id="revealBtn" class="ctrl-btn success">✅ كشف</button>
        <button id="nextBtn" class="ctrl-btn primary">➡️ التالي</button>
        <button id="girlsPlusBtn" class="ctrl-btn girls">👧 +1</button>
        <button id="boysPlusBtn" class="ctrl-btn boys">👦 +1</button>
        <button id="newRoundBtn" class="ctrl-btn ghost">🔄 جديد</button>
      </div>

    </section>

    <!-- ===== RESULTS SCREEN ===== -->
    <section id="resultsScreen" class="screen hidden">
      <div class="results-card">
        <img src="/images/logo.png" class="results-logo">
        <h2>🏆 انتهت الجولة!</h2>
        <div class="final-battle">
          <div class="final-team">
            <img src="/images/girl-team.png">
            <span class="final-name">البنات</span>
            <span class="final-score" id="finalGirlsScore">0</span>
          </div>
          <div class="final-vs">VS</div>
          <div class="final-team">
            <img src="/images/boy-team.png">
            <span class="final-name">الشباب</span>
            <span class="final-score" id="finalBoysScore">0</span>
          </div>
        </div>
        <div class="winner-text" id="winnerText"></div>
        <button id="replayBtn" class="generate-btn">🔄 جولة جديدة</button>
      </div>
    </section>

    <!-- Loading -->
    <div id="loadingOverlay" class="loading-overlay hidden">
      <div class="spinner"></div>
      <p id="loadingText">جاري التجهيز...</p>
    </div>

    <!-- Confetti -->
    <canvas id="confettiCanvas"></canvas>

    <!-- Sound Toggle -->
    <button id="soundToggle" class="sound-toggle">🔊</button>

  </div>
  <script src="/app.js"></script>
</body>
</html>
